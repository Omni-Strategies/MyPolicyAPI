services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: mypolicy-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    container_name: mypolicy-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/mypolicy-documents;
      echo 'bucket ready';
      exit 0;
      "
    restart: "no"

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/public/images
    depends_on:
      - redis
      - minio
      - minio-init
      # add "- mypolicy-db" back below if USE_LOCAL_DB=true (see note at bottom)
    env_file: .env
    environment:
      LOG_DIR: /app/logs
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL:-true}
      # S3_*, WIGAL_*, SMTP_* all come from env_file: .env below
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: Postgres-pgadmin
    restart: unless-stopped
    ports:
      - "8231:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: wonder@mail.com
      PGADMIN_DEFAULT_PASSWORD: killmonger!0
    # No depends_on on mypolicy-db anymore — add a server manually in
    # pgAdmin's UI pointing at either localhost:5436 or your RDS endpoint.

  # -------------------------------------------------------------------
  # Local Postgres — optional. Only needed if you want a local db for
  # dev/testing separate from AWS RDS. Leave it running and just point
  # DB_HOST at RDS in .env when you want prod data; docker compose will
  # keep this container idle in the background if unused.
  # To fully remove it: delete this block + the "pgdata" volume below.
  # -------------------------------------------------------------------
  mypolicy-db:
    container_name: mypolicy-dbV2
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: mypolicy_user
      POSTGRES_PASSWORD: mypolicypass
      POSTGRES_DB: mypolicy
      POSTGRES_INITDB_ARGS: "-c password_encryption=scram-sha-256 -c ssl=off"
    volumes:
      - ./init-auth.sh:/docker-entrypoint-initdb.d/00-init-auth.sh
      - ./db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./seeds:/docker-entrypoint-initdb.d/seeds
      - ./seeds/init-seeds.sh:/docker-entrypoint-initdb.d/02-init-seeds.sh
      - pgdata:/var/lib/postgresql/data

volumes:
  redis_data:
  uploads:
  pgdata:
  minio_data: